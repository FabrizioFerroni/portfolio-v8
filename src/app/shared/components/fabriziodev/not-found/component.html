<div class="min-h-screen flex flex-col select-none">
  <app-navbar />
  <main class="flex-grow flex items-center justify-center py-20 px-4">
    <div class="max-w-3xl w-full mx-auto text-center">
      <div class="fade-slide-in mb-8">
        <h1 class="text-9xl font-bold text-primary mb-4">404</h1>
        <h2 class="text-3xl font-semibold mb-4">¡Página no encontrada!</h2>
        <p class="text-xl text-muted-foreground mb-8">
          Parece que te has aventurado en territorio desconocido. Esta página ha desaparecido, nunca
          existió o está jugando al escondite.
        </p>
      </div>

      <div class="scale-fade-in image-wrapper mb-12">
        <img
          ngSrc="/img/images/404-illustration.png"
          alt="Error 404 - Página no encontrada"
          width="448"
          height="256"
          priority
          style="object-fit: contain; width: 100%; height: 100%" />
      </div>

      <div class="fade-in-delayed">
        <!-- Botones de navegación -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center mb-8">
          <a
            routerLink="/"
            class="btn btn-primary flex items-center cursor-pointer"
            z-button
            zSize="lg"
            zType="default">
            <ng-icon name="lucideHome" class="mr-2 h-5 w-5" />
            Volver al inicio
          </a>
          <a
            href="javascript:void(0);"
            (click)="goBack()"
            z-button
            zSize="lg"
            zType="outline"
            class="btn btn-outline flex items-center cursor-pointer">
            <ng-icon name="lucideArrowLeft" class="mr-2 h-5 w-5" />
            Volver atrás
          </a>
        </div>

        <!-- Buscador humorístico -->
        <div class="mt-8 max-w-md mx-auto">
          <h3 class="text-lg font-medium mb-4">¿Buscabas algo específico?</h3>

          <div class="flex gap-2 items-center">
            <div class="relative flex-grow">
              <ng-icon
                name="lucideSearch"
                class="absolute left-3 top-1/2 transform -translate-y-1/2 h-4 w-4 text-muted-foreground" />
              <input
                type="text"
                placeholder="Intenta buscar aquí..."
                [value]="searchQuery()"
                (input)="searchQuery.set($any($event.target).value)"
                class="w-full pl-10 pr-4 py-2 rounded-md border border-input bg-background focus:border-primary" />
            </div>
            <button
              z-button
              type="button"
              class="cursor-pointer"
              zSize="lg"
              (click)="handleSearch()"
              [attr.disabled]="isSearching() ? '' : null"
              [zDisabled]="isSearching()"
              zType="default">
              @if (isSearching()) {
                <ng-icon name="lucideRefreshCw" class="mr-2 h-4 w-4 animate-spin" />
                <span>Buscando ...</span>
              } @else {
                <span>Buscar</span>
              }
            </button>
          </div>

          <!-- Respuesta humorística — se re-anima con key trick via ngIf -->
          @if (funnyResponse()) {
            <p class="funny-response mt-4 text-muted-foreground italic">
              {{ funnyResponse() }}
            </p>
          }
        </div>
      </div>
    </div>
  </main>
</div>
